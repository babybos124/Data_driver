<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Valet Driver</title>
    <!-- Google Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .card {
            max-width: 1280px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.12), 0 8px 24px -6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1a2b;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .header h1 i {
            color: #2563eb;
            font-size: 1.9rem;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .search-wrapper:focus-within {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-wrapper i {
            color: #64748b;
            font-size: 0.95rem;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            padding: 0.6rem 0.8rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            min-width: 200px;
            width: 100%;
            color: #0b1a2b;
        }

        .search-wrapper input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px -2px rgba(37, 99, 235, 0.25);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* table responsive */
        .table-responsive {
            overflow-x: auto;
            margin: 1.5rem 0 0.8rem;
            border-radius: 20px;
            border: 1px solid #eef2f6;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 500px;
        }

        th {
            text-align: left;
            padding: 1rem 1.2rem;
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid #edf2f7;
            color: #0f172a;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fafcff;
        }

        .col-no {
            width: 60px;
            font-weight: 500;
            color: #475569;
        }

        .col-name {
            font-weight: 500;
        }

        .col-phone {
            font-feature-settings: "tnum";
        }

        .col-email {
            color: #1e293b;
            word-break: break-word;
        }

        .action-icons {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .action-icons button {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .action-icons button:hover {
            background: #f1f5f9;
            color: #0b1a2b;
        }

        .action-icons .edit-btn:hover {
            color: #2563eb;
            background: #e0edff;
        }

        .action-icons .delete-btn:hover {
            color: #dc2626;
            background: #fee2e2;
        }

        .empty-row td {
            padding: 2.5rem 1.2rem;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        /* footer / info */
        .table-footer {
            display: flex;
            justify-content: flex-end;
            font-size: 0.85rem;
            color: #64748b;
            padding-top: 0.8rem;
            gap: 0.5rem;
        }

        .table-footer span {
            background: #f1f5f9;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
        }

        /* Modal sederhana (tanpa library) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            max-width: 480px;
            width: 100%;
            border-radius: 32px;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.3);
            animation: modalFade 0.2s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #0b1a2b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal h2 i {
            color: #2563eb;
        }

        .modal label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e293b;
            display: block;
            margin: 1.2rem 0 0.3rem;
        }

        .modal input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            background: #fafcff;
            transition: 0.15s;
        }

        .modal input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .modal-actions button {
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.9rem;
        }

        .modal-actions .btn-cancel {
            background: #f1f5f9;
            color: #1e293b;
        }

        .modal-actions .btn-cancel:hover {
            background: #e2e8f0;
        }

        .modal-actions .btn-submit {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 8px -2px rgba(37, 99, 235, 0.25);
        }

        .modal-actions .btn-submit:hover {
            background: #1d4ed8;
        }

        /* mobile */
        @media (max-width: 640px) {
            .card { padding: 1.25rem; }
            .header { flex-direction: column; align-items: stretch; gap: 0.8rem; }
            .header h1 { font-size: 1.5rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: 100%; }
            .search-wrapper input { min-width: auto; }
            .btn-primary { justify-content: center; }
            th, td { padding: 0.8rem 0.8rem; font-size: 0.85rem; }
            .col-no { width: 40px; }
            .action-icons button { padding: 0.2rem 0.4rem; }
            .modal { padding: 1.5rem; }
        }

        /* sedikit sentuhan */
        .badge-count {
            background: #e0edff;
            color: #2563eb;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.4rem;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <!-- Header -->
    <div class="header">
        <h1>
            <i class="fas fa-car-side"></i> Valet Driver
            <span class="badge-count" id="driverCount">0</span>
        </h1>
        <div class="action-bar">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari nama atau telepon..." />
            </div>
            <button class="btn-primary" id="openAddModal">
                <i class="fas fa-plus-circle"></i> Tambah Driver
            </button>
        </div>
    </div>

    <!-- Tabel -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="col-no">No</th>
                    <th>Nama Driver</th>
                    <th>Nomor Telepon</th>
                    <th>Email</th>
                    <th style="text-align:right;">Aksi</th>
                </tr>
            </thead>
            <tbody id="driverTableBody">
                <!-- data akan di-render via js -->
                <tr class="empty-row">
                    <td colspan="5">Tidak ada driver. Tambahkan driver baru!</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="table-footer">
        <span id="rowInfo">0 driver</span>
    </div>
</div>

<!-- Modal Tambah / Edit -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Tambah Driver</h2>
        <form id="driverForm">
            <label for="driverName">Nama Lengkap</label>
            <input type="text" id="driverName" placeholder="contoh: Andi Pratama" required />

            <label for="driverPhone">Nomor Telepon</label>
            <input type="tel" id="driverPhone" placeholder="08xx-xxxx-xxxx" required />

            <label for="driverEmail">Email</label>
            <input type="email" id="driverEmail" placeholder="andi@domain.com" required />

            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="closeModal">Batal</button>
                <button type="submit" class="btn-submit" id="submitBtn">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script>
    (function() {
        // ----- data awal -----
        let drivers = [
            { id: 1, name: 'Bambang Susanto', phone: '0812-3456-7890', email: 'bambang@valet.com' },
            { id: 2, name: 'Dewi Lestari', phone: '0821-9876-5432', email: 'dewi.lestari@driver.id' },
            { id: 3, name: 'Eko Prasetyo', phone: '0856-1234-5678', email: 'eko.p@valet.co' }
        ];
        let nextId = 4;

        // ----- DOM refs -----
        const tbody = document.getElementById('driverTableBody');
        const searchInput = document.getElementById('searchInput');
        const driverCount = document.getElementById('driverCount');
        const rowInfo = document.getElementById('rowInfo');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const driverForm = document.getElementById('driverForm');
        const driverName = document.getElementById('driverName');
        const driverPhone = document.getElementById('driverPhone');
        const driverEmail = document.getElementById('driverEmail');
        const submitBtn = document.getElementById('submitBtn');
        const closeModalBtn = document.getElementById('closeModal');
        const openAddBtn = document.getElementById('openAddModal');

        // state edit
        let editingId = null;

        // ----- render tabel -----
        function renderTable(filter = '') {
            const search = filter.trim().toLowerCase();
            let filtered = drivers;
            if (search !== '') {
                filtered = drivers.filter(d => 
                    d.name.toLowerCase().includes(search) || 
                    d.phone.includes(search) // telepon format tetap
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="5">Tidak ada driver yang cocok.</td></tr>`;
            } else {
                let html = '';
                filtered.forEach((d, index) => {
                    const no = index + 1;
                    html += `
                        <tr>
                            <td class="col-no">${no}</td>
                            <td class="col-name">${escapeHtml(d.name)}</td>
                            <td class="col-phone">${escapeHtml(d.phone)}</td>
                            <td class="col-email">${escapeHtml(d.email)}</td>
                            <td style="text-align:right;">
                                <div class="action-icons" style="justify-content:flex-end;">
                                    <button class="edit-btn" data-id="${d.id}" title="Edit"><i class="fas fa-pen"></i></button>
                                    <button class="delete-btn" data-id="${d.id}" title="Hapus"><i class="fas fa-trash-can"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            // update counter
            const total = drivers.length;
            driverCount.textContent = total;
            rowInfo.textContent = `${filtered.length} dari ${total} driver`;

            // event listener untuk tombol edit & hapus (delegasi)
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const id = parseInt(this.dataset.id);
                    openEditModal(id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const id = parseInt(this.dataset.id);
                    if (confirm('Yakin ingin menghapus driver ini?')) {
                        deleteDriver(id);
                    }
                });
            });
        }

        // helper escape
        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        // ----- CRUD -----
        function addDriver(name, phone, email) {
            const newDriver = {
                id: nextId++,
                name: name.trim(),
                phone: phone.trim(),
                email: email.trim()
            };
            drivers.push(newDriver);
            renderTable(searchInput.value);
        }

        function updateDriver(id, name, phone, email) {
            const idx = drivers.findIndex(d => d.id === id);
            if (idx !== -1) {
                drivers[idx].name = name.trim();
                drivers[idx].phone = phone.trim();
                drivers[idx].email = email.trim();
                renderTable(searchInput.value);
            }
        }

        function deleteDriver(id) {
            drivers = drivers.filter(d => d.id !== id);
            renderTable(searchInput.value);
        }

        // ----- modal logic -----
        function openModal(title, driverData = null) {
            modalTitle.innerHTML = title;
            if (driverData) {
                driverName.value = driverData.name;
                driverPhone.value = driverData.phone;
                driverEmail.value = driverData.email;
                editingId = driverData.id;
                submitBtn.textContent = 'Perbarui';
            } else {
                driverName.value = '';
                driverPhone.value = '';
                driverEmail.value = '';
                editingId = null;
                submitBtn.textContent = 'Simpan';
            }
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            driverForm.reset();
            editingId = null;
        }

        function openAddModal() {
            openModal('<i class="fas fa-user-plus"></i> Tambah Driver');
        }

        function openEditModal(id) {
            const driver = drivers.find(d => d.id === id);
            if (driver) {
                openModal('<i class="fas fa-user-edit"></i> Edit Driver', driver);
            }
        }

        // ----- form submit -----
        driverForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const name = driverName.value.trim();
            const phone = driverPhone.value.trim();
            const email = driverEmail.value.trim();

            if (!name || !phone || !email) {
                alert('Semua field harus diisi!');
                return;
            }

            if (editingId !== null) {
                updateDriver(editingId, name, phone, email);
            } else {
                addDriver(name, phone, email);
            }
            closeModal();
        });

        // ----- event listeners -----
        openAddBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });

        searchInput.addEventListener('input', function() {
            renderTable(this.value);
        });

        // ----- inisialisasi -----
        renderTable('');

        // jika tombol escape di modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

    })();
</script>
</body>
</html>
